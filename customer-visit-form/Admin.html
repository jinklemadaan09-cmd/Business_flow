<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1f3864; --navy-2: #2b4a80; --crimson: #b4232f; --bg: #f3f5f9; --card: #ffffff;
    --ink: #1b2333; --muted: #667085; --line: #dfe4ec; --soft: #eef2f8; --ok: #127a43;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; padding: 20px 16px 64px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .brand { font-size: 12px; letter-spacing: .14em; opacity: .75; font-weight: 600; }
  h1 { margin: 4px 0 2px; font-size: 22px; font-weight: 700; }
  .sub { opacity: .8; font-size: 13px; }
  main { margin-top: -48px; padding: 0 16px 120px; }

  .stepper { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: var(--radius); padding: 10px; box-shadow: 0 4px 18px rgba(16,30,60,.08); overflow-x: auto; }
  .step { flex: 1 0 auto; height: 40px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; border: 0; background: none; font-family: inherit; }
  .step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-size: 12px; font-weight: 700; color: var(--navy); }
  .step.active { background: var(--soft); color: var(--navy); font-weight: 600; }
  .step.active .n { background: var(--navy); color: #fff; }
  .step.done .n { background: var(--ok); color: #fff; }

  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-top: 14px; box-shadow: 0 4px 18px rgba(16,30,60,.06); }
  .card h2 { margin: 0; font-size: 18px; }
  .card .hint { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--crimson); margin-bottom: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .step .t { display: none; } .step.active .t { display: inline; } }

  label.f { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  label.f .req { color: var(--crimson); }
  input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(43,74,128,.15); }
  .err input, .err select, .err textarea, .err .pills { border-color: var(--crimson) !important; }
  .err .msg { display: block; }
  .msg { display: none; color: var(--crimson); font-size: 12px; margin-top: 4px; }
  .pre { position: relative; }
  .pre span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .pre input { padding-left: 30px; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; border: 1.5px solid transparent; border-radius: 10px; }
  .pill { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .pill.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .lane { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; background: #fbfcfe; }
  .lane.err { border-color: var(--crimson); }
  .lane-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .lane-h b { color: var(--navy); }
  .x { border: 0; background: none; color: var(--crimson); font: inherit; font-size: 13px; cursor: pointer; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--soft); color: var(--navy); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .chip small { color: var(--muted); font-weight: 500; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  .search { position: relative; }
  .results { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(16,30,60,.15); max-height: 240px; overflow: auto; display: none; }
  .results div { padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .results div small { color: var(--muted); }
  .results div:hover, .results div.hl { background: var(--soft); }
  .linkbtn { border: 1.5px dashed var(--navy-2); color: var(--navy); background: #fff; border-radius: 12px; padding: 12px; width: 100%; font: inherit; font-weight: 600; cursor: pointer; margin-top: 12px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-top: 1px solid var(--line); padding: 12px 16px; }
  .bar .wrap { display: flex; gap: 10px; align-items: center; }
  .bar .prog { flex: 1; font-size: 12px; color: var(--muted); }
  .btn { border: 0; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.pri { background: var(--navy); color: #fff; }
  .btn.sub { background: var(--crimson); color: #fff; }
  .btn.sec { background: var(--soft); color: var(--navy); }
  .btn:disabled { opacity: .6; cursor: default; }

  .review dl { display: grid; grid-template-columns: 200px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  .review dt { color: var(--muted); }
  .review dd { margin: 0; white-space: pre-wrap; }
  .review h3 { font-size: 13px; letter-spacing: .08em; color: var(--crimson); margin: 18px 0 8px; }
  @media (max-width: 560px) { .review dl { grid-template-columns: 1fr; } .review dd { margin-bottom: 6px; } }

  .done { text-align: center; padding: 36px 20px; }
  .done .ic { width: 64px; height: 64px; border-radius: 50%; background: #e6f4ec; color: var(--ok); display: grid; place-items: center; margin: 0 auto 12px; font-size: 32px; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none; z-index: 20; max-width: 90%; }
  .hidden { display: none !important; }
</style>
<style>
  .tabs { display: flex; gap: 6px; background: var(--card); border-radius: var(--radius); padding: 8px; box-shadow: 0 4px 18px rgba(16,30,60,.08); overflow-x: auto; }
  .tab { border: 0; background: none; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); padding: 10px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .tab.on { background: var(--navy); color: #fff; }
  .q { border: 1.5px solid var(--line); border-radius: 12px; margin-top: 10px; background: #fff; }
  .q.open { border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(43,74,128,.10); }
  .q-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .q-row .lbl { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--navy); white-space: nowrap; }
  .badge.req { background: #fbe9eb; color: var(--crimson); }
  .badge.lock { background: #fff4e0; color: #8a5a00; }
  .ib { border: 1.5px solid var(--line); background: #fff; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 14px; color: var(--navy); flex: 0 0 auto; }
  .ib:disabled { opacity: .35; cursor: default; }
  .ib.del { color: var(--crimson); }
  .q-edit { border-top: 1px solid var(--line); padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  @media (max-width: 560px) { .q-edit { grid-template-columns: 1fr; } .q-row { flex-wrap: wrap; } .q-row .lbl { flex-basis: 100%; white-space: normal; } .q-row .badge.t { display: none; } .q-row .ib:first-of-type { margin-left: auto; } }
  .tog { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tog input { width: 18px; height: 18px; }
  table.z { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.z th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 4px; }
  table.z td { padding: 4px; vertical-align: top; }
  table.z td:first-child { font-weight: 600; font-size: 13px; padding-top: 14px; width: 24%; }
  @media (max-width: 680px) {
    table.z thead { display: none; }
    table.z tr { display: block; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
    table.z td { display: block; width: auto !important; padding: 3px 0; }
    table.z td:first-child { padding-top: 0; }
  }
  .stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
  .stat div { background: var(--soft); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 22px; color: var(--navy); }
  .stat span { font-size: 12px; color: var(--muted); }
  .login { max-width: 380px; margin: 0 auto; }
  .removed .q { opacity: .7; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">SUGAM GROUP &middot; ADMIN</div>
    <h1>Customer Visit Form Admin</h1>
    <div class="sub">Change questions and options, zone emails and master data. The sheet columns follow your changes.</div>
  </div>
</header>

<main class="wrap">
  <section class="card login" id="login">
    <h2>Admin login</h2>
    <p class="hint">Enter the ADMIN_PIN from the Settings tab of the response sheet.</p>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')login()">
    <button class="btn pri" style="width:100%;margin-top:12px" onclick="login()" id="loginBtn">Open admin</button>
  </section>

  <div id="app" class="hidden">
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </div>
</main>

<div class="bar hidden" id="bar">
  <div class="wrap">
    <div class="prog" id="dirty">No unsaved changes</div>
    <button class="btn sub" id="saveBtn" onclick="saveCurrent()">Save changes</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var BOOT = <?!= boot ?>;
var EDITABLE_TYPES = [['text', 'Short text'], ['textarea', 'Long text'], ['number', 'Number'], ['money', 'Amount (Rs)'],
  ['date', 'Date'], ['email', 'Email'], ['tel', 'Mobile number'], ['single', 'Choose one (buttons)'],
  ['multi', 'Choose many (buttons)'], ['dropdown', 'Dropdown']];
var TYPE_NAME = { zone: 'Zone (from master)', flows: 'Flow builder (from master)' };
EDITABLE_TYPES.forEach(function (t) { TYPE_NAME[t[0]] = t[1]; });

var pin = '', D = null, fields = [], zones = [], settings = {}, tab = 'q', openId = null, dirty = false;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 4000); }
function run(fn, args, ok) {
  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) {
    toast(e && e.message ? e.message : String(e));
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('loginBtn').disabled = false;
  });
  r[fn].apply(r, args);
}

function login() {
  pin = document.getElementById('pin').value.trim();
  if (!pin) return;
  document.getElementById('loginBtn').disabled = true;
  run('adminLoad', [pin], function (d) {
    try { sessionStorage.setItem('sugamAdminPin', pin); } catch (e) {}
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('bar').classList.remove('hidden');
    load(d);
  });
}
function load(d) {
  D = d;
  fields = d.config.map(function (f) { return JSON.parse(JSON.stringify(f)); });
  zones = d.zones.map(function (z) { return JSON.parse(JSON.stringify(z)); });
  settings = JSON.parse(JSON.stringify(d.settings));
  setDirty(false); render();
}
function setDirty(v) {
  dirty = v;
  document.getElementById('dirty').textContent = v ? 'Unsaved changes' : 'No unsaved changes';
  document.getElementById('saveBtn').disabled = !v;
}

function render() {
  document.getElementById('tabs').innerHTML = [['q', 'Questions'], ['m', 'Zone emails'], ['d', 'Master data']].map(function (t) {
    return '<button class="tab' + (tab === t[0] ? ' on' : '') + '" onclick="setTab(\'' + t[0] + '\')">' + t[1] + '</button>';
  }).join('');
  var v = document.getElementById('view');
  if (tab === 'q') v.innerHTML = questionsHtml();
  else if (tab === 'm') v.innerHTML = mailHtml();
  else v.innerHTML = masterHtml();
  document.getElementById('bar').classList.toggle('hidden', tab === 'd');
}
function setTab(t) {
  if (dirty && !confirm('You have unsaved changes on this tab. Leave without saving?')) return;
  if (dirty) load(D);
  tab = t; render();
}

// ---- questions --------------------------------------------------------
function questionsHtml() {
  var h = '';
  BOOT.steps.forEach(function (name, si) {
    var list = fields.filter(function (f) { return f.active && f.step === si + 1; });
    h += '<section class="card"><div class="tag">STEP 0' + (si + 1) + '</div><h2>' + esc(name) + '</h2>' +
      '<p class="hint">' + list.length + ' question' + (list.length === 1 ? '' : 's') + '. Tap a question to edit it.</p>' +
      list.map(function (f, i) { return qHtml(f, i, list.length); }).join('') +
      '<button class="linkbtn" onclick="addQ(' + (si + 1) + ')">+ Add question to this step</button></section>';
  });
  var removed = fields.filter(function (f) { return !f.active; });
  if (removed.length) {
    h += '<section class="card removed"><div class="tag">REMOVED</div><h2>Removed questions</h2>' +
      '<p class="hint">Hidden from the form. Their old answers stay in the sheet, in a column marked "(removed)".</p>' +
      removed.map(function (f) {
        return '<div class="q"><div class="q-row"><span class="lbl">' + esc(f.label) + '</span><span class="badge t">' + esc(TYPE_NAME[f.type] || f.type) + '</span>' +
          '<button class="btn sec" style="padding:7px 12px" onclick="restoreQ(\'' + f.id + '\')">Restore</button></div></div>';
      }).join('') + '</section>';
  }
  return h;
}
function qHtml(f, i, n) {
  var open = openId === f.id, choice = ['single', 'multi', 'dropdown'].indexOf(f.type) >= 0;
  var h = '<div class="q' + (open ? ' open' : '') + '"><div class="q-row">' +
    '<span class="lbl" onclick="toggleQ(\'' + f.id + '\')">' + esc(f.label || '(no text)') + '</span>' +
    (f.locked ? '<span class="badge lock">Core</span>' : '') +
    (f.required ? '<span class="badge req">Required</span>' : '') +
    '<span class="badge t">' + esc(TYPE_NAME[f.type] || f.type) + '</span>' +
    '<button class="ib" title="Move up" onclick="moveQ(\'' + f.id + '\',-1)"' + (i === 0 ? ' disabled' : '') + '>&#8593;</button>' +
    '<button class="ib" title="Move down" onclick="moveQ(\'' + f.id + '\',1)"' + (i === n - 1 ? ' disabled' : '') + '>&#8595;</button>' +
    '<button class="ib" title="Edit" onclick="toggleQ(\'' + f.id + '\')">&#9998;</button>' +
    '<button class="ib del" title="Delete" onclick="delQ(\'' + f.id + '\')"' + (f.locked ? ' disabled' : '') + '>&#128465;</button></div>';
  if (open) {
    h += '<div class="q-edit">' +
      '<div class="full"><label class="f">Question text</label><input value="' + esc(f.label) + '" oninput="setQ(\'' + f.id + '\',\'label\',this.value,1)"></div>' +
      '<div><label class="f">Answer type</label>' + (f.locked
        ? '<input value="' + esc(TYPE_NAME[f.type] || f.type) + '" disabled>'
        : '<select onchange="setQ(\'' + f.id + '\',\'type\',this.value)">' + EDITABLE_TYPES.map(function (t) {
            return '<option value="' + t[0] + '"' + (t[0] === f.type ? ' selected' : '') + '>' + t[1] + '</option>'; }).join('') + '</select>') + '</div>' +
      '<div><label class="f">Step</label><select onchange="setQ(\'' + f.id + '\',\'step\',Number(this.value))">' + BOOT.steps.map(function (s, si) {
        return '<option value="' + (si + 1) + '"' + (si + 1 === f.step ? ' selected' : '') + '>Step 0' + (si + 1) + ' - ' + esc(s) + '</option>'; }).join('') + '</select></div>' +
      (choice ? '<div class="full"><label class="f">Options (one per line)</label><textarea style="min-height:120px" oninput="setOptions(\'' + f.id + '\',this.value)">' + esc(f.options.join('\n')) + '</textarea></div>' : '') +
      '<div class="full"><label class="f">Help text (optional)</label><input value="' + esc(f.help) + '" oninput="setQ(\'' + f.id + '\',\'help\',this.value,1)"></div>' +
      '<label class="tog full"><input type="checkbox"' + (f.required ? ' checked' : '') + ' onchange="setQ(\'' + f.id + '\',\'required\',this.checked)"> Required</label>' +
      (f.locked ? '<div class="hint full" style="margin:0">Core question: used for the mail and the summary, so it cannot be deleted or change type. You can still rename it.</div>' : '') +
      '</div>';
  }
  return h + '</div>';
}
function byId(id) { return fields.filter(function (f) { return f.id === id; })[0]; }
function toggleQ(id) { openId = openId === id ? null : id; render(); }
function setQ(id, k, v, noRender) {
  var f = byId(id); f[k] = v;
  if (k === 'type' && ['single', 'multi', 'dropdown'].indexOf(v) >= 0 && !f.options.length) f.options = ['Option 1', 'Option 2'];
  if (k === 'step') { fields.splice(fields.indexOf(f), 1); fields.push(f); }
  setDirty(true);
  if (!noRender) render();
}
function setOptions(id, txt) { byId(id).options = txt.split('\n').map(function (s) { return s.trim(); }).filter(String); setDirty(true); }
function addQ(step) {
  var id = 'f_' + Date.now().toString(36);
  fields.push({ id: id, step: step, label: 'New question', type: 'text', required: false, options: [], help: '', active: true, locked: false, isNew: true });
  openId = id; setDirty(true); render();
}
function delQ(id) {
  var f = byId(id);
  if (f.locked) return;
  if (!confirm('Delete "' + f.label + '"? Old answers stay in the sheet.')) return;
  if (f.isNew) fields.splice(fields.indexOf(f), 1); else f.active = false;
  setDirty(true); render();
}
function restoreQ(id) { byId(id).active = true; setDirty(true); render(); }
function moveQ(id, dir) {
  var f = byId(id);
  var same = fields.filter(function (x) { return x.active && x.step === f.step; });
  var j = same.indexOf(f) + dir; if (j < 0 || j >= same.length) return;
  var other = same[j], a = fields.indexOf(f), b = fields.indexOf(other);
  fields[a] = other; fields[b] = f;
  setDirty(true); render();
}

// ---- zone emails ------------------------------------------------------
function mailHtml() {
  return '<section class="card"><div class="tag">MAIL</div><h2>Who gets the visit mail</h2>' +
    '<p class="hint">Every visit goes to the Costing Head and to the Regional Manager of the customer zone.</p>' +
    '<div class="grid">' +
    sInput('COSTING_HEAD_EMAIL', 'Costing Head email (comma for more than one)', 1) +
    sInput('ALWAYS_CC', 'Always CC (optional)', 1) +
    '<label class="tog full"><input type="checkbox"' + (String(settings.CC_FIELD_REP).toUpperCase() === 'YES' ? ' checked' : '') +
      ' onchange="settings.CC_FIELD_REP=this.checked?\'YES\':\'NO\';setDirty(true)"> Send a copy to the field representative</label></div></section>' +
    '<section class="card"><div class="tag">ZONES</div><h2>Regional Manager per zone</h2>' +
    '<p class="hint">Zones come from the dashboard master. A new zone in the master appears here automatically.</p>' +
    '<table class="z"><thead><tr><th>Zone</th><th>RM name</th><th>RM email</th><th>Extra CC</th></tr></thead><tbody>' +
    zones.map(function (z, i) {
      return '<tr><td>' + esc(z.zone) + '</td>' + ['name', 'email', 'cc'].map(function (k) {
        return '<td><input value="' + esc(z[k]) + '" placeholder="' + { name: 'Name', email: 'name@company.com', cc: 'optional' }[k] +
          '" oninput="zones[' + i + '].' + k + '=this.value;setDirty(true)"></td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></section>';
}
function sInput(k, label, full) {
  return '<div' + (full ? ' class="full"' : '') + '><label class="f">' + label + '</label><input value="' + esc(settings[k]) +
    '" oninput="settings.' + k + '=this.value;setDirty(true)"></div>';
}

// ---- master data ------------------------------------------------------
function masterHtml() {
  var m = D.masters;
  return '<section class="card"><div class="tag">MASTER</div><h2>Zones & locations</h2>' +
    '<p class="hint">Source: <b>' + esc(m.source) + '</b>. The form reads it again every 10 minutes.</p>' +
    '<div class="stat"><div><b>' + m.originZones + '</b><span>Origin zones</span></div><div><b>' + m.origins + '</b><span>Origin branches</span></div>' +
    '<div><b>' + m.destZones + '</b><span>Destination zones</span></div><div><b>' + m.dests + '</b><span>Destinations</span></div></div>' +
    '<div class="grid">' + sInput('DASHBOARD_MASTER_SHEET', 'Dashboard master spreadsheet link (engine sheet with LANE_ORIGIN, LANE_DEST)', 1) +
    sInput('ORIGIN_ZONE_COLUMN', 'Origin zone column (LANE_ORIGIN)') + sInput('DEST_ZONE_COLUMN', 'Destination zone column (LANE_DEST)') + '</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn pri" onclick="saveMaster()">Save & reload master</button>' +
    '<button class="btn sec" onclick="refreshMaster()">Reload master now</button>' +
    '<a class="btn sec" style="text-decoration:none" href="' + esc(D.sheetUrl) + '" target="_blank">Open response sheet</a></div></section>';
}
function refreshMaster() { run('adminRefreshMasters', [pin], function (d) { load(d); toast('Master reloaded'); }); }
function saveMaster() { run('adminSaveMail', [pin, zones, settings], function (d) { load(d); toast('Saved. Master reloaded'); }); }

// ---- save -------------------------------------------------------------
function saveCurrent() {
  var b = document.getElementById('saveBtn'); b.disabled = true;
  if (tab === 'q') {
    var bad = fields.filter(function (f) { return f.active && !String(f.label).trim(); })[0];
    if (bad) { toast('A question has no text'); b.disabled = false; return; }
    var send = fields.map(function (f) {
      return { id: f.isNew ? '' : f.id, step: f.step, label: f.label, type: f.type, required: f.required, options: f.options, help: f.help, active: f.active };
    });
    run('adminSaveConfig', [pin, send], function () {
      run('adminLoad', [pin], function (d) { load(d); toast('Saved. Form and sheet columns updated'); });
    });
  } else {
    run('adminSaveMail', [pin, zones, settings], function (d) { load(d); toast('Saved'); });
  }
}
window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

(function init() {
  try { var p = sessionStorage.getItem('sugamAdminPin'); if (p) { document.getElementById('pin').value = p; login(); } } catch (e) {}
})();
</script>
</body>
