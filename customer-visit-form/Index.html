<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1f3864; --navy-2: #2b4a80; --crimson: #b4232f; --bg: #f3f5f9; --card: #ffffff;
    --ink: #1b2333; --muted: #667085; --line: #dfe4ec; --soft: #eef2f8; --ok: #127a43;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; padding: 20px 16px 64px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .brand { font-size: 12px; letter-spacing: .14em; opacity: .75; font-weight: 600; }
  h1 { margin: 4px 0 2px; font-size: 22px; font-weight: 700; }
  .sub { opacity: .8; font-size: 13px; }
  main { margin-top: -48px; padding: 0 16px 120px; }

  .stepper { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: var(--radius); padding: 10px; box-shadow: 0 4px 18px rgba(16,30,60,.08); overflow-x: auto; }
  .step { flex: 1 0 auto; height: 40px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; border: 0; background: none; font-family: inherit; }
  .step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-size: 12px; font-weight: 700; color: var(--navy); }
  .step.active { background: var(--soft); color: var(--navy); font-weight: 600; }
  .step.active .n { background: var(--navy); color: #fff; }
  .step.done .n { background: var(--ok); color: #fff; }

  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-top: 14px; box-shadow: 0 4px 18px rgba(16,30,60,.06); }
  .card h2 { margin: 0; font-size: 18px; }
  .card .hint { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--crimson); margin-bottom: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .step .t { display: none; } .step.active .t { display: inline; } }

  label.f { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  label.f .req { color: var(--crimson); }
  input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(43,74,128,.15); }
  .err input, .err select, .err textarea, .err .pills { border-color: var(--crimson) !important; }
  .err .msg { display: block; }
  .msg { display: none; color: var(--crimson); font-size: 12px; margin-top: 4px; }
  .pre { position: relative; }
  .pre span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .pre input { padding-left: 30px; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; border: 1.5px solid transparent; border-radius: 10px; }
  .pill { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .pill.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .lane { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; background: #fbfcfe; }
  .lane.err { border-color: var(--crimson); }
  .lane-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .lane-h b { color: var(--navy); }
  .x { border: 0; background: none; color: var(--crimson); font: inherit; font-size: 13px; cursor: pointer; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--soft); color: var(--navy); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .chip small { color: var(--muted); font-weight: 500; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  .search { position: relative; }
  .results { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(16,30,60,.15); max-height: 240px; overflow: auto; display: none; }
  .results div { padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .results div small { color: var(--muted); }
  .results div:hover, .results div.hl { background: var(--soft); }
  .linkbtn { border: 1.5px dashed var(--navy-2); color: var(--navy); background: #fff; border-radius: 12px; padding: 12px; width: 100%; font: inherit; font-weight: 600; cursor: pointer; margin-top: 12px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-top: 1px solid var(--line); padding: 12px 16px; }
  .bar .wrap { display: flex; gap: 10px; align-items: center; }
  .bar .prog { flex: 1; font-size: 12px; color: var(--muted); }
  .btn { border: 0; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.pri { background: var(--navy); color: #fff; }
  .btn.sub { background: var(--crimson); color: #fff; }
  .btn.sec { background: var(--soft); color: var(--navy); }
  .btn:disabled { opacity: .6; cursor: default; }

  .review dl { display: grid; grid-template-columns: 200px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  .review dt { color: var(--muted); }
  .review dd { margin: 0; white-space: pre-wrap; }
  .review h3 { font-size: 13px; letter-spacing: .08em; color: var(--crimson); margin: 18px 0 8px; }
  @media (max-width: 560px) { .review dl { grid-template-columns: 1fr; } .review dd { margin-bottom: 6px; } }

  .done { text-align: center; padding: 36px 20px; }
  .done .ic { width: 64px; height: 64px; border-radius: 50%; background: #e6f4ec; color: var(--ok); display: grid; place-items: center; margin: 0 auto 12px; font-size: 32px; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none; z-index: 20; max-width: 90%; }
  .hidden { display: none !important; }
</style>
<style>
  .flow { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; background: #fbfcfe; }
  .flow.err { border-color: var(--crimson); }
  .route { font-size: 12px; color: var(--navy); background: var(--soft); border-radius: 8px; padding: 7px 10px; margin-bottom: 12px; font-weight: 600; word-break: break-word; }
  .stops { position: relative; margin-left: 6px; }
  .stop { position: relative; padding: 0 0 14px 26px; }
  .stop::before { content: ''; position: absolute; left: 6px; top: 22px; bottom: -4px; width: 2px; background: var(--line); }
  .stop:last-child::before { display: none; }
  .dot { position: absolute; left: 0; top: 8px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--navy-2); }
  .stop.first .dot { background: var(--navy); border-color: var(--navy); }
  .stop.last .dot { border-color: var(--crimson); background: var(--crimson); }
  .stop-h { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
  .addstop { border: 0; background: none; color: var(--navy-2); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 0 4px 26px; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">SUGAM GROUP</div>
    <h1>Customer Visit Report</h1>
    <div class="sub">Steps 01 to 05 of the customer journey. Costing Head and zone RM are emailed on submit.</div>
  </div>
</header>

<main class="wrap">
  <nav class="stepper" id="stepper"></nav>
  <div id="pages"></div>
  <div id="donePage" class="card done hidden">
    <div class="ic">&#10003;</div>
    <h2>Visit submitted</h2>
    <p class="hint" id="doneText"></p>
    <button class="btn pri" onclick="newVisit()">Fill another visit</button>
  </div>
</main>

<div class="bar" id="bar">
  <div class="wrap">
    <button class="btn sec" id="backBtn" onclick="go(cur - 1)">Back</button>
    <div class="prog" id="prog"></div>
    <button class="btn pri" id="nextBtn" onclick="next()">Next</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var BOOT = <?!= boot ?>;
var M = BOOT.masters;
var ORIGIN_ZONES = Object.keys(M.origins).sort();
var DEST_ZONES = Object.keys(M.dests).sort();
var SHORT = ['Visit', 'Business', 'Material', 'Flows', 'Rate'];

var STEPS = BOOT.steps.map(function (name, i) {
  return { tag: 'STEP 0' + (i + 1), title: name, short: SHORT[i] || ('Step ' + (i + 1)),
    fields: BOOT.fields.filter(function (f) { return f.step === i + 1; }) };
}).concat([{ tag: 'REVIEW', title: 'Check & submit', short: 'Submit', review: true, fields: [] }]);

var DRAFT_KEY = 'sugamVisitDraft2';
var data = {}, flows = [], cur = 0, maxSeen = 0;
var FREQS = ['Daily', '2-3 times a week', 'Weekly', 'Fortnightly', 'Monthly'];

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function opts(list, v, blank) {
  return (blank != null ? '<option value="">' + esc(blank) + '</option>' : '') +
    list.map(function (o) { return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('');
}

// ---- fields -------------------------------------------------------------
function fieldHtml(f) {
  if (f.type === 'flows') {
    return '<div class="full" id="w_' + f.id + '"><label class="f">' + esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</label>' +
      (f.help ? '<div class="hint" style="margin:0 0 4px">' + esc(f.help) + '</div>' : '') +
      '<div id="flows"></div><button type="button" class="linkbtn" onclick="addFlow()">+ Add another flow</button></div>';
  }
  var k = f.id, v = data[k] == null ? '' : data[k], t = f.type;
  var full = t === 'textarea' || t === 'single' || t === 'multi' || (f.options && f.options.length > 4);
  var h = '<div class="fld' + (full ? ' full' : '') + '" id="w_' + k + '"><label class="f">' + esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</label>';
  if (t === 'zone') h += '<select data-k="' + k + '">' + opts(ORIGIN_ZONES, v, 'Select...') + '</select>';
  else if (t === 'dropdown') h += '<select data-k="' + k + '">' + opts(f.options, v, 'Select...') + '</select>';
  else if (t === 'textarea') h += '<textarea data-k="' + k + '">' + esc(v) + '</textarea>';
  else if (t === 'single' || t === 'multi') {
    var sel = t === 'multi' ? (Array.isArray(v) ? v : []) : [v];
    h += '<div class="pills" data-k="' + k + '" data-multi="' + (t === 'multi' ? 1 : 0) + '">' + f.options.map(function (o) {
      return '<button type="button" class="pill' + (sel.indexOf(o) >= 0 ? ' on' : '') + '" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
  } else if (t === 'money') {
    h += '<div class="pre"><span>&#8377;</span><input data-k="' + k + '" type="number" inputmode="decimal" min="0" step="any" value="' + esc(v) + '"></div>';
  } else {
    var it = { number: 'number', date: 'date', email: 'email', tel: 'tel' }[t] || 'text';
    h += '<input data-k="' + k + '" type="' + it + '"' + (it === 'number' ? ' inputmode="decimal" min="0" step="any"' : '') + ' value="' + esc(v) + '">';
  }
  if (f.help) h += '<div class="hint" style="margin:4px 0 0">' + esc(f.help) + '</div>';
  return h + '<span class="msg">Required</span></div>';
}

function render() {
  document.getElementById('stepper').innerHTML = STEPS.map(function (s, i) {
    var done = i < maxSeen && i !== cur;
    return '<button class="step' + (i === cur ? ' active' : '') + (done ? ' done' : '') + '" onclick="jump(' + i + ')"><span class="n">' + (done ? '&#10003;' : i + 1) + '</span><span class="t">' + esc(s.short) + '</span></button>';
  }).join('');
  var s = STEPS[cur], h = '<section class="card"><div class="tag">' + s.tag + '</div><h2>' + esc(s.title) + '</h2>';
  if (s.review) h += reviewHtml();
  else if (!s.fields.length) h += '<p class="empty">No questions in this step.</p>';
  else h += '<div class="grid" style="margin-top:14px">' + s.fields.map(fieldHtml).join('') + '</div>';
  document.getElementById('pages').innerHTML = h + '</section>';
  if (document.getElementById('flows')) { if (!flows.length) addFlow(true); else renderFlows(); }
  document.getElementById('backBtn').style.visibility = cur ? 'visible' : 'hidden';
  var nb = document.getElementById('nextBtn');
  nb.textContent = s.review ? 'Submit visit' : 'Next';
  nb.className = 'btn ' + (s.review ? 'sub' : 'pri');
  document.getElementById('prog').textContent = 'Step ' + (cur + 1) + ' of ' + STEPS.length;
  window.scrollTo(0, 0);
}

document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
function onEdit(e) { var k = e.target.getAttribute('data-k'); if (k) { data[k] = e.target.value; clearErr(k); save(); } }
document.addEventListener('click', function (e) {
  var p = e.target.closest('.pill'); if (!p) return;
  var box = p.parentNode, k = box.getAttribute('data-k'), v = p.getAttribute('data-v');
  if (box.getAttribute('data-multi') === '1') {
    var arr = Array.isArray(data[k]) ? data[k] : [], i = arr.indexOf(v);
    if (i >= 0) arr.splice(i, 1); else arr.push(v);
    data[k] = arr; p.classList.toggle('on');
  } else {
    data[k] = data[k] === v ? '' : v;
    Array.prototype.forEach.call(box.children, function (b) { b.classList.toggle('on', b.getAttribute('data-v') === data[k]); });
  }
  clearErr(k); save();
});
function clearErr(k) { var w = document.getElementById('w_' + k); if (w) w.classList.remove('err'); }

// ---- flows: origin > stop > stop ... ------------------------------------
function newStop() { return { zone: '', place: '' }; }
function addFlow(silent) {
  var z = '';
  var zf = BOOT.fields.filter(function (f) { return f.type === 'zone'; })[0];
  if (zf && data[zf.id]) z = data[zf.id];
  flows.push({ stops: [{ zone: z, place: '' }, newStop()], mt: '', freq: '', note: '' });
  renderFlows(); save();
  if (!silent) { var c = document.querySelectorAll('.flow'); c[c.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}
function removeFlow(i) { flows.splice(i, 1); if (!flows.length) addFlow(true); renderFlows(); save(); }
function addStop(i) { flows[i].stops.push(newStop()); renderFlows(); save(); }
function removeStop(i, k) { flows[i].stops.splice(k, 1); renderFlows(); save(); }
function setStop(i, k, key, v) {
  flows[i].stops[k][key] = v;
  if (key === 'zone') flows[i].stops[k].place = '';
  renderFlows(); save();
}
function setFlow(i, key, v) { flows[i][key] = v; save(); }
function stopName(s) { return s.place || (s.zone ? 'ALL OF ' + s.zone : '?'); }

function renderFlows() {
  var el = document.getElementById('flows'); if (!el) return;
  el.innerHTML = flows.map(function (fl, i) {
    var n = fl.stops.length;
    return '<div class="flow" id="flow' + i + '"><div class="lane-h"><b>Flow ' + (i + 1) + '</b>' +
      (flows.length > 1 ? '<button class="x" onclick="removeFlow(' + i + ')">Remove flow</button>' : '') + '</div>' +
      '<div class="route">' + fl.stops.map(function (s) { return esc(stopName(s)); }).join(' &rarr; ') + '</div>' +
      '<div class="stops">' + fl.stops.map(function (s, k) {
        var first = k === 0, zones = first ? ORIGIN_ZONES : DEST_ZONES;
        var places = s.zone ? ((first ? M.origins : M.dests)[s.zone] || []) : [];
        return '<div class="stop' + (first ? ' first' : '') + (k === n - 1 && !first ? ' last' : '') + '"><span class="dot"></span>' +
          '<div class="stop-h"><span>' + (first ? 'ORIGIN (BOOKING)' : (k === n - 1 ? 'GOES TO (FINAL)' : 'THEN GOES TO (STOP ' + k + ')')) + '</span>' +
          (!first && n > 2 ? '<button class="x" onclick="removeStop(' + i + ',' + k + ')">Remove</button>' : '') + '</div>' +
          '<div class="two"><select onchange="setStop(' + i + ',' + k + ',\'zone\',this.value)">' + opts(zones, s.zone, first ? 'Origin zone...' : 'Destination zone...') + '</select>' +
          '<select onchange="setStop(' + i + ',' + k + ',\'place\',this.value)"' + (s.zone ? '' : ' disabled') + '>' +
          '<option value="">' + (s.zone ? (first ? 'Any branch in zone' : 'Whole zone') : 'Pick zone first') + '</option>' + opts(places, s.place) + '</select></div></div>';
      }).join('') + '</div>' +
      '<button type="button" class="addstop" onclick="addStop(' + i + ')">+ Add next stop</button>' +
      '<div class="two" style="margin-top:10px"><div><label class="f">MT / month on this flow</label><input type="number" inputmode="decimal" min="0" step="any" value="' + esc(fl.mt) + '" oninput="setFlow(' + i + ',\'mt\',this.value)"></div>' +
      '<div><label class="f">Frequency</label><select onchange="setFlow(' + i + ',\'freq\',this.value)">' + opts(FREQS, fl.freq, 'Select...') + '</select></div></div>' +
      '<div style="margin-top:8px"><label class="f">Note (optional)</label><input value="' + esc(fl.note) + '" oninput="setFlow(' + i + ',\'note\',this.value)" placeholder="e.g. transshipment at Siliguri"></div>' +
      '<span class="msg" style="margin-top:8px">Pick a zone for every stop</span></div>';
  }).join('');
}
function flowsOk() { return flows.length && flows.every(function (fl) { return fl.stops.length >= 2 && fl.stops.every(function (s) { return s.zone; }); }); }

// ---- validation & navigation ------------------------------------------
function badField(f) {
  if (f.type === 'flows') return f.required && !flowsOk();
  var v = data[f.id];
  var empty = v == null || (Array.isArray(v) ? !v.length : !String(v).trim());
  if (f.required && empty) return true;
  if (!empty && f.type === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) return true;
  if (!empty && f.type === 'tel' && !/^[0-9+ -]{10,15}$/.test(v)) return true;
  return false;
}
function valid(step) {
  var ok = true, first = null;
  STEPS[step].fields.forEach(function (f) {
    var bad = badField(f), w = document.getElementById('w_' + f.id);
    if (f.type === 'flows') {
      flows.forEach(function (fl, i) {
        var b = !(fl.stops.length >= 2 && fl.stops.every(function (s) { return s.zone; }));
        var el = document.getElementById('flow' + i);
        if (el) { el.classList.toggle('err', b); el.querySelector(':scope > .msg').style.display = b ? 'block' : 'none'; if (b) first = first || el; }
      });
    } else if (w) w.classList.toggle('err', bad);
    if (bad) { ok = false; first = first || w; }
  });
  if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); toast('Please fill the highlighted fields'); }
  return ok;
}
function stepOk(step) { return STEPS[step].fields.every(function (f) { return !badField(f); }); }
function go(i) { if (i < 0 || i >= STEPS.length) return; document.getElementById('toast').style.display = 'none'; cur = i; maxSeen = Math.max(maxSeen, cur); render(); }
function jump(i) { if (i <= maxSeen || valid(cur)) go(i); }
function next() { if (STEPS[cur].review) return submit(); if (valid(cur)) go(cur + 1); }

function reviewHtml() {
  var h = '<div class="review">';
  STEPS.forEach(function (s, si) {
    if (s.review || !s.fields.length) return;
    h += '<h3>' + s.tag + ' &middot; ' + esc(s.title.toUpperCase()) + ' <button class="x" onclick="go(' + si + ')">Edit</button></h3><dl>';
    s.fields.forEach(function (f) {
      if (f.type === 'flows') {
        flows.forEach(function (fl, i) {
          h += '<dt>Flow ' + (i + 1) + '</dt><dd>' + fl.stops.map(function (x) { return esc(stopName(x)); }).join(' &rarr; ') +
            (fl.mt ? ' &middot; ' + esc(fl.mt) + ' MT/month' : '') + (fl.freq ? ' &middot; ' + esc(fl.freq) : '') + '</dd>';
        });
        return;
      }
      var v = data[f.id]; if (Array.isArray(v)) v = v.join(', ');
      if (v) h += '<dt>' + esc(f.label) + '</dt><dd>' + (f.type === 'money' ? '&#8377; ' : '') + esc(v) + '</dd>';
    });
    h += '</dl>';
  });
  return h + '</div>';
}

function submit() {
  for (var i = 0; i < STEPS.length - 1; i++) { if (!stepOk(i)) { go(i); valid(i); return; } }
  var nb = document.getElementById('nextBtn');
  nb.disabled = true; nb.textContent = 'Submitting...';
  var payload = JSON.parse(JSON.stringify(data));
  payload.flows = flows;
  google.script.run
    .withSuccessHandler(function (r) {
      ['pages', 'stepper', 'bar'].forEach(function (id) { document.getElementById(id).classList.add('hidden'); });
      document.getElementById('donePage').classList.remove('hidden');
      document.getElementById('toast').style.display = 'none';
      document.getElementById('doneText').innerHTML = 'Visit ID <b>' + esc(r.id) + '</b> saved to the sheet.<br>' +
        (r.status.indexOf('SENT') === 0 ? 'Costing Head and Regional Manager have been emailed.' : 'Mail: ' + esc(r.status));
      nb.disabled = false;
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      window.scrollTo(0, 0);
    })
    .withFailureHandler(function (err) {
      nb.disabled = false; nb.textContent = 'Submit visit';
      toast('Could not submit: ' + (err && err.message ? err.message : err) + '. Your entries are kept, try again.');
    })
    .submitVisit(payload);
}
function newVisit() {
  data = { repName: data.repName, repEmail: data.repEmail, visitDate: new Date().toISOString().slice(0, 10) };
  flows = []; cur = 0; maxSeen = 0;
  ['pages', 'stepper', 'bar'].forEach(function (id) { document.getElementById(id).classList.remove('hidden'); });
  document.getElementById('donePage').classList.add('hidden');
  save(); render();
}

// ---- draft kept on this phone -----------------------------------------
function save() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ data: data, flows: flows })); } catch (e) {} }
function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 3500); }

(function init() {
  try { var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); if (d) { data = d.data || {}; flows = d.flows || []; } } catch (e) {}
  if (!data.visitDate) data.visitDate = new Date().toISOString().slice(0, 10);
  render();
})();
</script>
