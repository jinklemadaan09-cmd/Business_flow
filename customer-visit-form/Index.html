<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1f3864; --navy-2: #2b4a80; --crimson: #b4232f; --bg: #f3f5f9; --card: #ffffff;
    --ink: #1b2333; --muted: #667085; --line: #dfe4ec; --soft: #eef2f8; --ok: #127a43;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; padding: 20px 16px 64px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .brand { font-size: 12px; letter-spacing: .14em; opacity: .75; font-weight: 600; }
  h1 { margin: 4px 0 2px; font-size: 22px; font-weight: 700; }
  .sub { opacity: .8; font-size: 13px; }
  main { margin-top: -48px; padding: 0 16px 120px; }

  .stepper { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: var(--radius); padding: 10px; box-shadow: 0 4px 18px rgba(16,30,60,.08); overflow-x: auto; }
  .step { flex: 1 0 auto; height: 40px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; border: 0; background: none; font-family: inherit; }
  .step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-size: 12px; font-weight: 700; color: var(--navy); }
  .step.active { background: var(--soft); color: var(--navy); font-weight: 600; }
  .step.active .n { background: var(--navy); color: #fff; }
  .step.done .n { background: var(--ok); color: #fff; }

  .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-top: 14px; box-shadow: 0 4px 18px rgba(16,30,60,.06); }
  .card h2 { margin: 0; font-size: 18px; }
  .card .hint { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--crimson); margin-bottom: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } .step .t { display: none; } .step.active .t { display: inline; } }

  label.f { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  label.f .req { color: var(--crimson); }
  input, select, textarea { width: 100%; font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--navy-2); box-shadow: 0 0 0 3px rgba(43,74,128,.15); }
  .err input, .err select, .err textarea, .err .pills { border-color: var(--crimson) !important; }
  .err .msg { display: block; }
  .msg { display: none; color: var(--crimson); font-size: 12px; margin-top: 4px; }
  .pre { position: relative; }
  .pre span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .pre input { padding-left: 30px; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; border: 1.5px solid transparent; border-radius: 10px; }
  .pill { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .pill.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .lane { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; background: #fbfcfe; }
  .lane.err { border-color: var(--crimson); }
  .lane-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .lane-h b { color: var(--navy); }
  .x { border: 0; background: none; color: var(--crimson); font: inherit; font-size: 13px; cursor: pointer; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--soft); color: var(--navy); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .chip small { color: var(--muted); font-weight: 500; }
  .chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  .search { position: relative; }
  .results { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(16,30,60,.15); max-height: 240px; overflow: auto; display: none; }
  .results div { padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .results div small { color: var(--muted); }
  .results div:hover, .results div.hl { background: var(--soft); }
  .linkbtn { border: 1.5px dashed var(--navy-2); color: var(--navy); background: #fff; border-radius: 12px; padding: 12px; width: 100%; font: inherit; font-weight: 600; cursor: pointer; margin-top: 12px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-top: 1px solid var(--line); padding: 12px 16px; }
  .bar .wrap { display: flex; gap: 10px; align-items: center; }
  .bar .prog { flex: 1; font-size: 12px; color: var(--muted); }
  .btn { border: 0; border-radius: 10px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.pri { background: var(--navy); color: #fff; }
  .btn.sub { background: var(--crimson); color: #fff; }
  .btn.sec { background: var(--soft); color: var(--navy); }
  .btn:disabled { opacity: .6; cursor: default; }

  .review dl { display: grid; grid-template-columns: 200px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
  .review dt { color: var(--muted); }
  .review dd { margin: 0; white-space: pre-wrap; }
  .review h3 { font-size: 13px; letter-spacing: .08em; color: var(--crimson); margin: 18px 0 8px; }
  @media (max-width: 560px) { .review dl { grid-template-columns: 1fr; } .review dd { margin-bottom: 6px; } }

  .done { text-align: center; padding: 36px 20px; }
  .done .ic { width: 64px; height: 64px; border-radius: 50%; background: #e6f4ec; color: var(--ok); display: grid; place-items: center; margin: 0 auto 12px; font-size: 32px; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; display: none; z-index: 20; max-width: 90%; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">SUGAM GROUP</div>
    <h1>Customer Visit Report</h1>
    <div class="sub">Steps 01 to 05 of the customer journey. Costing Head and zone RM are emailed on submit.</div>
  </div>
</header>

<main class="wrap">
  <nav class="stepper" id="stepper"></nav>
  <div id="pages"></div>
  <div id="donePage" class="card done hidden">
    <div class="ic">&#10003;</div>
    <h2>Visit submitted</h2>
    <p class="hint" id="doneText"></p>
    <button class="btn pri" onclick="newVisit()">Fill another visit</button>
  </div>
</main>

<div class="bar" id="bar">
  <div class="wrap">
    <button class="btn sec" id="backBtn" onclick="go(cur - 1)">Back</button>
    <div class="prog" id="prog"></div>
    <button class="btn pri" id="nextBtn" onclick="next()">Next</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var MASTERS = <?!= masters ?>;
var ZONES = Object.keys(MASTERS.originsByZone).sort();
var ALL_CITIES = [];
Object.keys(MASTERS.destByRegion).sort().forEach(function (r) {
  MASTERS.destByRegion[r].forEach(function (c) { ALL_CITIES.push({ city: c, region: r }); });
});

// ---- page definitions -------------------------------------------------
var STEPS = [
  { tag: 'STEP 01', title: 'Customer Visit', short: 'Visit', hint: 'Who you met and what they need.', fields: [
    ['repName', 'Your name', 'text', 1], ['repEmail', 'Your email', 'email', 1],
    ['visitDate', 'Visit date', 'date', 1], ['customer', 'Customer / company name', 'text', 1],
    ['zone', 'Customer zone', 'select', 1, ZONES, 'Decides which Regional Manager gets the mail'],
    ['city', 'Customer city / location', 'text', 1],
    ['contact', 'Contact person & designation', 'text', 1], ['phone', 'Contact mobile', 'tel', 1],
    ['custEmail', 'Customer email', 'email'], ['decision', 'Decision makers (name / role)', 'text'],
    ['business', 'Business model / industry', 'text', 0, null, null, 1],
    ['currentTpt', 'Current transport set-up', 'textarea', 0, null, 'Current transporter, mode, issues'],
    ['pain', 'Pain points', 'textarea'],
    ['expect', 'Service expectations', 'textarea', 0, null, 'TAT, pickup, POD, tracking etc.']
  ]},
  { tag: 'STEP 02', title: 'Monthly Business Potential', short: 'Business', hint: 'Is this commercially viable?', fields: [
    ['mValue', 'Current monthly freight spend', 'money', 1], ['mVolume', 'Current monthly volume (MT)', 'number', 1],
    ['mShip', 'Shipments / dockets per month', 'number'],
    ['freq', 'Dispatch frequency', 'pills', 0, ['Daily', '2-3 times a week', 'Weekly', 'Fortnightly', 'Monthly'], null, 1],
    ['season', 'Seasonality (peak / lean months)', 'text', 0, null, null, 1],
    ['potValue', 'Potential monthly business with Sugam', 'money', 1], ['potVolume', 'Potential monthly volume (MT)', 'number']
  ]},
  { tag: 'STEP 03', title: 'Material Understanding', short: 'Material', hint: 'Plan safe, suitable, profitable transport.', fields: [
    ['commodity', 'Commodity / material description', 'text', 1, null, null, 1],
    ['matType', 'Material category', 'multi', 0, ['FMCG', 'Textiles / Garments', 'Pharma', 'Electronics', 'Auto parts', 'Machinery / Spares', 'Chemicals', 'Hardware / Building material', 'Paper / Printing', 'Plastic / Polymers', 'Food grains / Agro', 'Other'], null, 1],
    ['load', 'Load type', 'pills', 1, ['Part load (LTL)', 'Full truck load (FTL)', 'Both'], null, 1],
    ['pkgWt', 'Avg weight per package (kg)', 'number'], ['dims', 'Package dimensions (L x W x H)', 'text'],
    ['packing', 'Packing type', 'multi', 0, ['Carton', 'Bags / Bora', 'Bundles', 'Drums', 'Wooden crate', 'Pallet', 'Loose'], null, 1],
    ['handling', 'Special handling needs', 'textarea'],
    ['risk', 'Special risks / restrictions', 'textarea', 0, null, 'Hazardous, fragile, high value, permits']
  ]},
  { tag: 'STEP 04', title: 'Origin & Destination Mapping', short: 'Lanes', hint: 'Add one card per origin branch. Each origin can go to many destinations.', lanes: true, fields: [
    ['coverage', 'Branch coverage & feasibility', 'pills', 0, ['All lanes covered', 'Partly covered', 'Not covered / new arrangement'], null, 1]
  ]},
  { tag: 'STEP 05', title: 'Indicative Rate Discussion', short: 'Rate', hint: 'Indicative only. Final quotation goes after HO costing & approval.', fields: [
    ['rateBasis', 'Rate basis', 'pills', 0, ['Per kg', 'Per package', 'Per vehicle (FTL)'], null, 1],
    ['curRate', 'Customer current rate', 'money'], ['expRate', 'Rate expected by customer', 'money', 1],
    ['indRate', 'Indicative rate discussed by us', 'money'],
    ['charges', 'Other charges discussed', 'multi', 0, ['Fuel surcharge', 'FOV / Insurance', 'FOD', 'Docket charge', 'ODA', 'Handling', 'Door delivery'], null, 1],
    ['credit', 'Credit period required', 'pills', 1, ['Advance / To pay', '15 days', '30 days', '45 days', '60 days', '90 days'], null, 1],
    ['followup', 'Next follow-up date', 'date'],
    ['remarks', 'Remarks / next steps', 'textarea', 0, null, null, 1]
  ]},
  { tag: 'REVIEW', title: 'Check & submit', short: 'Submit', review: true }
];

var data = {}, lanes = [], cur = 0, maxSeen = 0;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// ---- render -----------------------------------------------------------
function fieldHtml(f) {
  var k = f[0], label = f[1], type = f[2], req = f[3], opts = f[4], hint = f[5], full = f[6] || type === 'textarea';
  var v = data[k] == null ? '' : data[k];
  var h = '<div class="fld' + (full ? ' full' : '') + '" id="w_' + k + '"><label class="f">' + esc(label) + (req ? ' <span class="req">*</span>' : '') + '</label>';
  if (type === 'select') {
    h += '<select data-k="' + k + '"><option value="">Select...</option>' + opts.map(function (o) {
      return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
  } else if (type === 'textarea') {
    h += '<textarea data-k="' + k + '">' + esc(v) + '</textarea>';
  } else if (type === 'pills' || type === 'multi') {
    var sel = type === 'multi' ? (v || []) : [v];
    h += '<div class="pills" data-k="' + k + '" data-multi="' + (type === 'multi' ? 1 : 0) + '">' + opts.map(function (o) {
      return '<button type="button" class="pill' + (sel.indexOf(o) >= 0 ? ' on' : '') + '" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div>';
  } else if (type === 'money') {
    h += '<div class="pre"><span>&#8377;</span><input data-k="' + k + '" type="number" inputmode="decimal" min="0" step="any" value="' + esc(v) + '"></div>';
  } else {
    h += '<input data-k="' + k + '" type="' + type + '"' + (type === 'number' ? ' inputmode="decimal" min="0" step="any"' : '') + ' value="' + esc(v) + '">';
  }
  if (hint) h += '<div class="hint" style="margin:4px 0 0">' + esc(hint) + '</div>';
  return h + '<span class="msg">Required</span></div>';
}

function render() {
  document.getElementById('stepper').innerHTML = STEPS.map(function (s, i) {
    return '<button class="step' + (i === cur ? ' active' : '') + (i < maxSeen && i !== cur ? ' done' : '') + '" onclick="jump(' + i + ')"><span class="n">' + (i < maxSeen && i !== cur ? '&#10003;' : i + 1) + '</span><span class="t">' + s.short + '</span></button>';
  }).join('');
  var s = STEPS[cur], h = '<section class="card"><div class="tag">' + s.tag + '</div><h2>' + s.title + '</h2>';
  if (s.hint) h += '<p class="hint">' + s.hint + '</p>';
  if (s.review) h += reviewHtml();
  if (s.lanes) h += '<div id="lanes"></div><button type="button" class="linkbtn" onclick="addLane()">+ Add another origin branch</button><div style="height:14px"></div>';
  if (s.fields) h += '<div class="grid">' + s.fields.map(fieldHtml).join('') + '</div>';
  h += '</section>';
  document.getElementById('pages').innerHTML = h;
  if (s.lanes) { if (!lanes.length) addLane(true); else renderLanes(); }
  document.getElementById('backBtn').style.visibility = cur ? 'visible' : 'hidden';
  var nb = document.getElementById('nextBtn');
  nb.textContent = s.review ? 'Submit visit' : 'Next';
  nb.className = 'btn ' + (s.review ? 'sub' : 'pri');
  document.getElementById('prog').textContent = 'Step ' + (cur + 1) + ' of ' + STEPS.length;
  window.scrollTo(0, 0);
}

// ---- inputs -----------------------------------------------------------
document.addEventListener('input', function (e) {
  var k = e.target.getAttribute('data-k');
  if (k) { data[k] = e.target.value; clearErr(k); save(); }
});
document.addEventListener('change', function (e) {
  var k = e.target.getAttribute('data-k');
  if (k) { data[k] = e.target.value; clearErr(k); save(); }
});
document.addEventListener('click', function (e) {
  var p = e.target.closest('.pill');
  if (!p) return;
  var box = p.parentNode, k = box.getAttribute('data-k'), v = p.getAttribute('data-v');
  if (box.getAttribute('data-multi') === '1') {
    var arr = data[k] || [], i = arr.indexOf(v);
    if (i >= 0) arr.splice(i, 1); else arr.push(v);
    data[k] = arr; p.classList.toggle('on');
  } else {
    data[k] = data[k] === v ? '' : v;
    Array.prototype.forEach.call(box.children, function (b) { b.classList.toggle('on', b.getAttribute('data-v') === data[k]); });
  }
  clearErr(k); save();
});
function clearErr(k) { var w = document.getElementById('w_' + k); if (w) w.classList.remove('err'); }

// ---- lanes ------------------------------------------------------------
function addLane(silent) {
  lanes.push({ originZone: data.zone || '', origin: '', dests: [], mt: '', freq: '' });
  renderLanes(); save();
  if (!silent) { var c = document.querySelectorAll('.lane'); c[c.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}
function removeLane(i) { lanes.splice(i, 1); if (!lanes.length) addLane(true); renderLanes(); save(); }
function laneSet(i, k, v) {
  lanes[i][k] = v;
  if (k === 'originZone') { lanes[i].origin = ''; renderLanes(); }
  save();
}
function renderLanes() {
  var el = document.getElementById('lanes'); if (!el) return;
  el.innerHTML = lanes.map(function (l, i) {
    var branches = MASTERS.originsByZone[l.originZone] || [];
    return '<div class="lane" id="lane' + i + '"><div class="lane-h"><b>Origin ' + (i + 1) + '</b>' +
      (lanes.length > 1 ? '<button class="x" onclick="removeLane(' + i + ')">Remove</button>' : '') + '</div>' +
      '<div class="grid">' +
      '<div><label class="f">Origin zone <span class="req">*</span></label><select onchange="laneSet(' + i + ',\'originZone\',this.value)"><option value="">Select...</option>' +
        ZONES.map(function (z) { return '<option' + (z === l.originZone ? ' selected' : '') + '>' + esc(z) + '</option>'; }).join('') + '</select></div>' +
      '<div><label class="f">Sugam origin branch <span class="req">*</span></label><select onchange="laneSet(' + i + ',\'origin\',this.value)"' + (branches.length ? '' : ' disabled') + '><option value="">' + (branches.length ? 'Select...' : 'Pick zone first') + '</option>' +
        branches.map(function (b) { return '<option' + (b === l.origin ? ' selected' : '') + '>' + esc(b) + '</option>'; }).join('') + '</select></div>' +
      '<div class="full"><label class="f">Destinations <span class="req">*</span></label><div class="search"><input placeholder="Type city or region, e.g. KATHMANDU or WEST BENGAL" oninput="find(' + i + ',this)" onkeydown="findKey(event,' + i + ',this)" onblur="setTimeout(function(){hideRes(' + i + ')},200)"><div class="results" id="res' + i + '"></div></div>' +
        '<div class="chips">' + l.dests.map(function (d, j) {
          return '<span class="chip">' + esc(d.city) + ' <small>' + esc(d.region) + '</small><button onclick="rmDest(' + i + ',' + j + ')">&times;</button></span>'; }).join('') + '</div></div>' +
      '<div><label class="f">Volume on this origin (MT / month)</label><input type="number" inputmode="decimal" min="0" step="any" value="' + esc(l.mt) + '" oninput="laneSet(' + i + ',\'mt\',this.value)"></div>' +
      '<div><label class="f">Frequency</label><select onchange="laneSet(' + i + ',\'freq\',this.value)"><option value="">Select...</option>' +
        ['Daily', '2-3 times a week', 'Weekly', 'Fortnightly', 'Monthly'].map(function (f) { return '<option' + (f === l.freq ? ' selected' : '') + '>' + f + '</option>'; }).join('') + '</select></div>' +
      '</div><span class="msg" style="margin-top:8px">Pick origin branch and at least one destination</span></div>';
  }).join('');
}
function find(i, inp) {
  var q = inp.value.trim().toUpperCase(), box = document.getElementById('res' + i);
  if (q.length < 2) { box.style.display = 'none'; return; }
  var have = lanes[i].dests.map(function (d) { return d.city; });
  var regions = Object.keys(MASTERS.destByRegion).filter(function (r) { return r.indexOf(q) >= 0; }).map(function (r) {
    return { city: 'ALL OF ' + r, region: r, all: 1 }; });
  var hits = regions.concat(ALL_CITIES.filter(function (c) { return c.city.indexOf(q) >= 0 && have.indexOf(c.city) < 0; }))
    .sort(function (a, b) { return (b.all || 0) - (a.all || 0) || (a.city.indexOf(q) === 0 ? -1 : 0) - (b.city.indexOf(q) === 0 ? -1 : 0); })
    .slice(0, 30);
  box.innerHTML = hits.length ? hits.map(function (c, j) {
    return '<div class="' + (j ? '' : 'hl') + '" onmousedown="pick(' + i + ',\'' + esc(c.city).replace(/'/g, "\\'") + '\',\'' + esc(c.region) + '\')"><span>' + esc(c.city) + '</span><small>' + (c.all ? MASTERS.destByRegion[c.region].length + ' cities' : esc(c.region)) + '</small></div>'; }).join('')
    : '<div><span>No match. Press Enter to add "' + esc(q) + '"</span></div>';
  box.style.display = 'block';
}
function findKey(e, i, inp) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  var first = document.querySelector('#res' + i + ' div');
  var q = inp.value.trim().toUpperCase();
  if (first && first.getAttribute('onmousedown')) first.onmousedown();
  else if (q) pick(i, q, 'OTHER');
}
function pick(i, city, region) {
  if (!lanes[i].dests.some(function (d) { return d.city === city; })) lanes[i].dests.push({ city: city, region: region });
  renderLanes(); save();
  var inp = document.querySelector('#lane' + i + ' .search input'); if (inp) inp.focus();
}
function hideRes(i) { var b = document.getElementById('res' + i); if (b) b.style.display = 'none'; }
function rmDest(i, j) { lanes[i].dests.splice(j, 1); renderLanes(); save(); }

// ---- navigation & validation -----------------------------------------
function valid(step) {
  var s = STEPS[step], ok = true, first = null;
  (s.fields || []).forEach(function (f) {
    var v = data[f[0]], bad = f[3] && (!v || (Array.isArray(v) && !v.length) || !String(v).trim());
    if (!bad && f[2] === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) bad = true;
    if (!bad && f[2] === 'tel' && v && !/^[0-9+ -]{10,15}$/.test(v)) bad = true;
    var w = document.getElementById('w_' + f[0]);
    if (w) w.classList.toggle('err', !!bad);
    if (bad) { ok = false; first = first || w; }
  });
  if (s.lanes) {
    lanes.forEach(function (l, i) {
      var bad = !l.origin || !l.dests.length, el = document.getElementById('lane' + i);
      if (el) { el.classList.toggle('err', bad); el.querySelector(':scope > .msg').style.display = bad ? 'block' : 'none'; }
      if (bad) { ok = false; first = first || el; }
    });
  }
  if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); toast('Please fill the highlighted fields'); }
  return ok;
}
function go(i) { if (i < 0 || i >= STEPS.length) return; document.getElementById('toast').style.display = 'none'; cur = i; maxSeen = Math.max(maxSeen, cur); render(); }
function jump(i) { if (i <= maxSeen || valid(cur)) go(i); }
function next() {
  if (STEPS[cur].review) return submit();
  if (valid(cur)) go(cur + 1);
}

function reviewHtml() {
  var h = '<div class="review">';
  STEPS.forEach(function (s, si) {
    if (s.review) return;
    h += '<h3>' + s.tag + ' &middot; ' + s.title.toUpperCase() + ' <button class="x" onclick="go(' + si + ')">Edit</button></h3><dl>';
    if (s.lanes) lanes.forEach(function (l, i) {
      h += '<dt>Origin ' + (i + 1) + ': ' + esc(l.origin || '-') + '</dt><dd>' + esc(l.dests.map(function (d) { return d.city; }).join(', ') || '-') +
        (l.mt ? ' &middot; ' + esc(l.mt) + ' MT/month' : '') + (l.freq ? ' &middot; ' + esc(l.freq) : '') + '</dd>';
    });
    (s.fields || []).forEach(function (f) {
      var v = data[f[0]]; if (Array.isArray(v)) v = v.join(', ');
      if (v) h += '<dt>' + esc(f[1]) + '</dt><dd>' + (f[2] === 'money' ? '&#8377; ' : '') + esc(v) + '</dd>';
    });
    h += '</dl>';
  });
  return h + '</div>';
}

function submit() {
  for (var i = 0; i < STEPS.length - 1; i++) { if (!validData(i)) { go(i); valid(i); return; } }
  var nb = document.getElementById('nextBtn');
  nb.disabled = true; nb.textContent = 'Submitting...';
  var payload = JSON.parse(JSON.stringify(data));
  payload.lanes = lanes;
  google.script.run
    .withSuccessHandler(function (r) {
      document.getElementById('pages').classList.add('hidden');
      document.getElementById('stepper').classList.add('hidden');
      document.getElementById('bar').classList.add('hidden');
      document.getElementById('donePage').classList.remove('hidden');
      document.getElementById('doneText').innerHTML = 'Visit ID <b>' + esc(r.id) + '</b> saved to the sheet.<br>' +
        (r.status.indexOf('SENT') === 0 ? 'Costing Head and Regional Manager have been emailed.' : 'Mail: ' + esc(r.status));
      document.getElementById('toast').style.display = 'none';
      try { localStorage.removeItem('sugamVisitDraft'); } catch (e) {}
      window.scrollTo(0, 0);
    })
    .withFailureHandler(function (err) {
      nb.disabled = false; nb.textContent = 'Submit visit';
      toast('Could not submit: ' + (err && err.message ? err.message : err) + '. Your entries are kept, try again.');
    })
    .submitVisit(payload);
}
function validData(step) {
  var s = STEPS[step];
  var fieldsOk = (s.fields || []).every(function (f) { var v = data[f[0]]; return !f[3] || (v && (!Array.isArray(v) || v.length) && String(v).trim()); });
  return fieldsOk && (!s.lanes || (lanes.length && lanes.every(function (l) { return l.origin && l.dests.length; })));
}
function newVisit() {
  var keep = { repName: data.repName, repEmail: data.repEmail };
  data = keep; lanes = []; cur = 0; maxSeen = 0;
  document.getElementById('pages').classList.remove('hidden');
  document.getElementById('stepper').classList.remove('hidden');
  document.getElementById('bar').classList.remove('hidden');
  document.getElementById('donePage').classList.add('hidden');
  save(); render();
}

// ---- draft (kept on this phone if the network drops) ------------------
function save() { try { localStorage.setItem('sugamVisitDraft', JSON.stringify({ data: data, lanes: lanes })); } catch (e) {} }
function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.style.display = 'none'; }, 3500); }

(function init() {
  try { var d = JSON.parse(localStorage.getItem('sugamVisitDraft') || 'null'); if (d) { data = d.data || {}; lanes = d.lanes || []; } } catch (e) {}
  if (!data.visitDate) data.visitDate = new Date().toISOString().slice(0, 10);
  render();
})();
</script>
</body>
</html>
