# GR PNL Engine <-> GitHub (same pattern as SCOT cross sell).
#   Every push to main that changes gr-pnl-engine/ code sends it to the live engine Apps Script (mode push).
#   Run by hand: GitHub > Actions > "GR engine: sync" > Run workflow
#     push = repo code > Apps Script
#     pull = Apps Script > repo (saves code written in the editor into gr-pnl-engine/)
# The engine's Script ID is in gr-pnl-engine/SCRIPT_ID.txt
#   (engine sheet > Extensions > Apps Script > Project Settings > IDs > Script ID).

name: "GR engine: sync"

on:
  push:
    branches: [main]
    paths:
      - "gr-pnl-engine/*.gs"
      - "gr-pnl-engine/*.html"
      - "tools/merge-apps-script.js"
      - ".github/workflows/gr-engine-sync.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "push = repo to Apps Script, pull = Apps Script to repo"
        type: choice
        options: [push, pull]
        default: push

permissions:
  contents: write

concurrency:
  group: gr-engine-sync
  cancel-in-progress: false

env:
  DIR: gr-pnl-engine
  MODE: ${{ github.event.inputs.mode || 'push' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read the Script ID
        run: |
          ID=$(tr -d ' \r\n' < "$DIR/SCRIPT_ID.txt" 2>/dev/null || true)
          if [ -z "$ID" ]; then echo "::error::Put the engine Script ID in $DIR/SCRIPT_ID.txt"; exit 1; fi
          echo "SCRIPT_ID=$ID" >> "$GITHUB_ENV"

      - name: Install clasp
        run: npm install -g @google/clasp@3

      - name: Load Google login (secret)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Copy the live engine project
        run: |
          mkdir -p "$RUNNER_TEMP/live" && cd "$RUNNER_TEMP/live"
          clasp clone "$SCRIPT_ID" \
            || { echo "::error::Could not open the engine Apps Script. The Google account in CLASPRC_JSON needs Editor access to the engine sheet."; exit 1; }
          echo "Live files:"; ls -1

      - name: Pull - save the live code into the repo
        if: env.MODE == 'pull'
        run: |
          for f in "$RUNNER_TEMP"/live/*.js "$RUNNER_TEMP"/live/*.gs "$RUNNER_TEMP"/live/*.html "$RUNNER_TEMP"/live/appsscript.json; do
            [ -f "$f" ] || continue
            b=$(basename "$f"); case "$b" in *.js) b="${b%.js}.gs";; esac
            cp "$f" "$DIR/$b"; echo "$b"
          done

      - name: Push - put the repo code into the live files
        if: env.MODE == 'push'
        env:
          REPORT: gr-pnl-engine/LIVE_PROJECT_FILES.txt
        run: node tools/merge-apps-script.js "$DIR" "$RUNNER_TEMP/live"

      - name: Push - send the code to Apps Script
        if: env.MODE == 'push'
        working-directory: ${{ runner.temp }}/live
        run: clasp push --force

      - name: Save changes in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "GR engine: live Apps Script $MODE [skip ci]" && git push || true
