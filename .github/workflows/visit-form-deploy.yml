# Every push to main that changes customer-visit-form/ sends the code straight to the
# Business_Flow Apps Script project and updates the live web app (same link, new version).
# No more copy-paste and "Deploy > Manage deployments > New version" by hand.
# Run again by hand: GitHub > Actions > "Visit form: deploy" > Run workflow.

name: "Visit form: deploy"

on:
  push:
    branches: [main]
    paths:
      - "customer-visit-form/*.gs"
      - "customer-visit-form/*.html"
      - "tools/merge-apps-script.js"
      - ".github/workflows/visit-form-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visit-form-deploy
  cancel-in-progress: false

env:
  # Apps Script > Project Settings > IDs > Script ID
  SCRIPT_ID: ""
  # Apps Script > Deploy > Manage deployments > the web app > Deployment ID
  DEPLOYMENT_ID: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check IDs
        id: ids
        run: |
          if [ -z "$SCRIPT_ID" ] || [ -z "$DEPLOYMENT_ID" ]; then
            echo "::warning::Not set up yet: SCRIPT_ID / DEPLOYMENT_ID are empty in .github/workflows/visit-form-deploy.yml. Nothing deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ids.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Install clasp
        if: steps.ids.outputs.ok == 'true'
        run: npm install -g @google/clasp@3

      - name: Load Google login (secret)
        if: steps.ids.outputs.ok == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Secret CLASPRC_JSON is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8'))" \
            || { echo "::error::CLASPRC_JSON is not valid JSON. Paste the CONTENT of .clasprc.json (it starts with {)."; exit 1; }

      - name: Copy the live project
        if: steps.ids.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/live" && cd "$RUNNER_TEMP/live"
          clasp clone "$SCRIPT_ID"
          echo "Live files:"; ls -1

      - name: Put the repo code into the live files (same names, nothing else removed)
        if: steps.ids.outputs.ok == 'true'
        run: node tools/merge-apps-script.js customer-visit-form "$RUNNER_TEMP/live"

      - name: Push code and update the live web app
        if: steps.ids.outputs.ok == 'true'
        working-directory: ${{ runner.temp }}/live
        run: |
          clasp push --force
          NOTE="GitHub $(echo $GITHUB_SHA | cut -c1-7)"
          VER=$(clasp create-version "$NOTE" 2>&1 | grep -o '[0-9]\+' | tail -1)
          echo "::notice::Web app now on Apps Script version $VER ($NOTE)"
          clasp update-deployment "$DEPLOYMENT_ID" --versionNumber "$VER" --description "$NOTE" \
            || clasp deploy --deploymentId "$DEPLOYMENT_ID" --versionNumber "$VER" --description "$NOTE"
